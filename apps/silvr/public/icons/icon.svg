<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Film Camela app icon. Source of truth for every platform icon (scripts/gen-icons.mjs).
       Keep the two top-level groups: #bg (background layer) and #mark (foreground layer).
       gen-icons derives: full-bleed (drops the corner clip), Android adaptive foreground/background, PWA maskable. -->
  <defs>
    <clipPath id="r"><rect width="512" height="512" rx="112"/></clipPath>
    <radialGradient id="g" cx="50%" cy="46%" r="62%">
      <stop offset="0" stop-color="#2e1c10"/>
      <stop offset="1" stop-color="#0e0d0c"/>
    </radialGradient>
    <linearGradient id="o" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb36b"/>
      <stop offset="0.55" stop-color="#ff8a2b"/>
      <stop offset="1" stop-color="#e8641a"/>
    </linearGradient>
    <radialGradient id="glass" cx="40%" cy="36%" r="70%">
      <stop offset="0" stop-color="#3b2516"/>
      <stop offset="1" stop-color="#0e0d0c"/>
    </radialGradient>
  </defs>
  <g id="bg" clip-path="url(#r)">
    <rect width="512" height="512" fill="url(#g)"/>
    <!-- 35mm perforations, a quiet nod to the film strip -->
    <g fill="#f3efe8" opacity="0.075">
      <rect x="64" y="58" width="36" height="24" rx="6"/><rect x="146" y="58" width="36" height="24" rx="6"/><rect x="228" y="58" width="36" height="24" rx="6"/><rect x="310" y="58" width="36" height="24" rx="6"/><rect x="392" y="58" width="36" height="24" rx="6"/>
      <rect x="64" y="430" width="36" height="24" rx="6"/><rect x="146" y="430" width="36" height="24" rx="6"/><rect x="228" y="430" width="36" height="24" rx="6"/><rect x="310" y="430" width="36" height="24" rx="6"/><rect x="392" y="430" width="36" height="24" rx="6"/>
    </g>
  </g>
  <g id="mark" transform="translate(256 261) scale(1.1) translate(-256 -261)">
    <!-- body: a rangefinder whose top plate rises into two soft camel humps -->
    <path fill="#f3efe8" d="M112 214 C140 212 156 150 202 150 C238 150 244 184 256 184 C268 184 274 150 310 150 C356 150 372 212 400 214 Z"/>
    <rect x="100" y="196" width="312" height="176" rx="36" fill="#f3efe8"/>
    <!-- leatherette band -->
    <path fill="#e2d9cb" d="M100 262 H412 V336 A36 36 0 0 1 376 372 H136 A36 36 0 0 1 100 336 Z"/>
    <!-- viewfinder window + shutter release break the symmetry so it reads as a camera -->
    <rect x="124" y="218" width="44" height="26" rx="8" fill="#0e0d0c"/>
    <circle cx="370" cy="231" r="13" fill="#ff8a2b"/>
    <!-- lens -->
    <circle cx="256" cy="290" r="88" fill="#0e0d0c"/>
    <circle cx="256" cy="290" r="70" fill="none" stroke="url(#o)" stroke-width="24"/>
    <circle cx="256" cy="290" r="50" fill="url(#glass)"/>
    <circle cx="236" cy="270" r="12" fill="#f3efe8" opacity="0.9"/>
  </g>
</svg>
